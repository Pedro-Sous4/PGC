{% extends 'core/base.html' %}

{% block title %}Editar Histórico PGC - {{ Credor.nome }}{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <!-- Header -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white py-3">
                    <h3 class="mb-0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Editar Histórico PGC
                    </h3>
                    <small class="opacity-75">Credor: {{ Credor.nome }}</small>
                </div>
            </div>

            <!-- Formulário de edição -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="periodo" class="form-label">
                                <i class="bi bi-calendar me-1"></i> Período
                            </label>
                            <input type="text" class="form-control" id="periodo" name="periodo" 
                                   value="{{ historico.periodo }}" required>
                            <small class="text-muted">Ex: 01/2024</small>
                        </div>

                        <div class="mb-3">
                            <label for="numero_pgc" class="form-label">
                                <i class="bi bi-card-text me-1"></i> Número PGC
                            </label>
                            <input type="number" class="form-control" id="numero_pgc" name="numero_pgc" 
                                   value="{{ historico.numero_pgc }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="valor_total" class="form-label">
                                <i class="bi bi-currency-dollar me-1"></i> Valor Total
                            </label>
                            <input type="number" step="0.01" class="form-control" id="valor_total" 
                                   name="valor_total" value="{{ historico.valor_total }}" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                            </button>
                            <a href="{% url 'detalhe_rendimentos' Credor.id %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
