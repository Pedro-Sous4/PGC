<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Modal LGM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .cursor-pointer {
            cursor: pointer;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .cursor-pointer:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Teste Modal LGM - Depuração</h2>
        
        <button class="btn btn-primary mb-3" onclick="simularProcessamento()">
            <i class="bi bi-play-circle"></i> Simular Processamento Completo
        </button>
        
        <div id="resultado-teste" class="mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Dados de teste
        const dadosTeste = {
            processed: 5,
            total: 10,
            logs: [
                {time: "10:30:00", msg: "✔ Processamento iniciado"},
                {time: "10:30:01", msg: "📋 Processando credor 1/10: João Silva"},
                {time: "10:30:02", msg: "⚠️ Nenhum extrato encontrado para João Silva"},
                {time: "10:30:03", msg: "❌ ERRO Falha ao processar Maria Santos"},
                {time: "10:30:04", msg: "🏁 Processamento finalizado com sucesso"}
            ]
        };
        
        function simularProcessamento() {
            const resultado = document.getElementById('resultado-teste');
            resultado.innerHTML = '<div class="alert alert-info">Processando simulação...</div>';
            
            setTimeout(() => {
                mostrarModalResumo('completed', dadosTeste);
                resultado.innerHTML = '<div class="alert alert-success">Modal deve ter aparecido!</div>';
            }, 1000);
        }
        
        // Função para mostrar modal de resumo
        function mostrarModalResumo(status, dados) {
            const isSucesso = status === 'completed';
            const modalId = 'resumoModal';
            
            // Remover modal anterior se existir
            const modalAnterior = document.getElementById(modalId);
            if (modalAnterior) {
                modalAnterior.remove();
            }
            
            const erros = dados.logs.filter(log => log.msg.includes('❌'));
            const warnings = dados.logs.filter(log => log.msg.includes('⚠️'));
            const sucesso = dados.logs.filter(log => log.msg.includes('✔') || log.msg.includes('🏁'));
            
            let resumoHtml = `
              <div class="modal fade" id="${modalId}" tabindex="-1">
                <div class="modal-dialog modal-lg">
                  <div class="modal-content">
                    <div class="modal-header ${isSucesso ? 'bg-success' : 'bg-danger'} text-white">
                      <h5 class="modal-title">
                        ${isSucesso ? '✅ Processamento Concluído com Sucesso!' : '❌ Erro no Processamento!'}
                      </h5>
                      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                      <div class="row">
                        <div class="col-md-6">
                          <div class="card border-primary">
                            <div class="card-body text-center">
                              <i class="bi bi-people-fill fs-1 text-primary"></i>
                              <h4 class="mt-2">${dados.processed || 0}</h4>
                              <p class="mb-0">Credores Processados</p>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="card border-primary">
                            <div class="card-body text-center">
                              <i class="bi bi-clock-history fs-1 text-primary"></i>
                              <h4 class="mt-2">${dados.total || 0}</h4>
                              <p class="mb-0">Credores Totais</p>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="row mt-3">`;
            
            // Cards interativos
            resumoHtml += `
              <div class="col-md-4">
                <div class="card ${sucesso.length > 0 ? 'border-success cursor-pointer' : 'border-success opacity-50'}" 
                     onclick="abrirDetalhes('success', ${JSON.stringify(sucesso)})">
                  <div class="card-body text-center">
                    <i class="bi bi-check-circle fs-3 text-success"></i>
                    <h5 class="mt-1">${sucesso.length}</h5>
                    <small class="text-muted">Sucessos</small>
                    ${sucesso.length > 0 ? '<small class="d-block text-info"><i class="bi bi-eye"></i> Clique para ver</small>' : ''}
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card ${warnings.length > 0 ? 'border-warning cursor-pointer' : 'border-warning opacity-50'}" 
                     onclick="abrirDetalhes('warning', ${JSON.stringify(warnings)})">
                  <div class="card-body text-center">
                    <i class="bi bi-exclamation-triangle fs-3 text-warning"></i>
                    <h5 class="mt-1">${warnings.length}</h5>
                    <small class="text-muted">Avisos</small>
                    ${warnings.length > 0 ? '<small class="d-block text-info"><i class="bi bi-eye"></i> Clique para ver</small>' : ''}
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card ${erros.length > 0 ? 'border-danger cursor-pointer' : 'border-danger opacity-50'}" 
                     onclick="abrirDetalhes('error', ${JSON.stringify(erros)})">
                  <div class="card-body text-center">
                    <i class="bi bi-x-circle fs-3 text-danger"></i>
                    <h5 class="mt-1">${erros.length}</h5>
                    <small class="text-muted">Erros</small>
                    ${erros.length > 0 ? '<small class="d-block text-info"><i class="bi bi-eye"></i> Clique para ver</small>' : ''}
                  </div>
                </div>
              </div>`;
            
            resumoHtml += `
                      </div>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                        <i class="bi bi-check-circle"></i> Fechar
                      </button>
                      <button type="button" class="btn btn-outline-primary" onclick="limparTeste()">
                        <i class="bi bi-arrow-clockwise"></i> Novo Teste
                      </button>
                    </div>
                  </div>
                </div>
              </div>`;
            
            document.body.insertAdjacentHTML('beforeend', resumoHtml);
            
            // Usar Bootstrap para mostrar o modal
            const modalElement = document.getElementById(modalId);
            const bootstrapModal = new bootstrap.Modal(modalElement);
            bootstrapModal.show();
            
            // Limpar modal quando for fechado
            modalElement.addEventListener('hidden.bs.modal', function () {
                this.remove();
            });
        }
        
        function abrirDetalhes(tipo, mensagens) {
            console.log('Botão clicado:', tipo, mensagens);
            
            const configs = {
                success: { icon: '✅', title: 'Sucessos', color: 'success' },
                warning: { icon: '⚠️', title: 'Avisos', color: 'warning' },
                error: { icon: '❌', title: 'Erros', color: 'danger' }
            };
            
            const cfg = configs[tipo];
            let mensagensHtml = '';
            
            mensagens.forEach(msg => {
                mensagensHtml += `
                    <div class="alert alert-${cfg.color}">
                        <strong>[${msg.time}]</strong> ${msg.msg}
                    </div>`;
            });
            
            const modalHtml = `
                <div class="modal fade" id="detalhesModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header bg-${cfg.color} text-white">
                                <h5 class="modal-title">${cfg.icon} ${cfg.title} (${mensagens.length})</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                ${mensagensHtml}
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            
            // Remover modal anterior se existir
            const modalAnterior = document.getElementById('detalhesModal');
            if (modalAnterior) modalAnterior.remove();
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            const modalElement = document.getElementById('detalhesModal');
            const bootstrapModal = new bootstrap.Modal(modalElement);
            bootstrapModal.show();
            
            modalElement.addEventListener('hidden.bs.modal', function () {
                this.remove();
            });
        }
        
        function limparTeste() {
            document.querySelectorAll('.modal').forEach(modal => modal.remove());
            document.getElementById('resultado-teste').innerHTML = '';
        }
    </script>
</body>
</html>
